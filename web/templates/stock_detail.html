<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ stock.code }} - AI Trader Indonesia
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}"
    >

    <style>

        body {
            margin: 0;
            padding: 30px;

            font-family:
                Arial,
                sans-serif;

            background: #f1f5f9;
            color: #0f172a;

            transition:
                background 0.2s,
                color 0.2s;
        }

        body.dark-mode {
            background:
                linear-gradient(
                    rgba(7, 17, 31, 0.78),
                    rgba(7, 17, 31, 0.78)
                ),
                url("/static/images/scanner-watermark-dark.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: #e5e7eb;
        }

        .detail-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .detail-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 22px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;

            padding: 10px 16px;

            border-radius: 8px;

            background: #2563eb;
            color: #ffffff;

            text-decoration: none;
            font-size: 13px;
            font-weight: 700;

            transition: 0.2s;
        }

        .back-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .theme-toggle {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #cbd5e1;
            border-radius: 10px;

            background: #ffffff;

            cursor: pointer;
            font-size: 18px;
        }

        body.dark-mode .theme-toggle {
            background: #172235;
            border-color: #334155;
        }

        .detail-heading {
            margin-bottom: 20px;
        }

        .stock-title {
            font-size: 28px;
            font-weight: 900;
            line-height: 1.1;
        }

        .detail-heading .company-name {
            margin-top: 5px;
            color: #64748b;
            font-size: 14px;
        }

        body.dark-mode .detail-heading .company-name {
            color: #94a3b8;
        }

        .detail-card-wrapper {
            margin-top: 20px;
        }

        .trading-chart-panel {
            margin-bottom: 18px;
            padding: 16px;
            border: 1px solid rgba(59, 130, 246, .22);
            border-radius: 12px;
            background: rgba(15, 23, 42, .35);
        }

        .trading-chart-header {
            margin-bottom: 14px;
        }

        .trading-chart-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .8px;
            color: #94a3b8;
        }

        .trading-chart-subtitle {
            margin-top: 4px;
            font-size: 11px;
            color: #64748b;
        }

        .trading-plan-chart {
            position: relative;
            width: 100%;
            height: 430px;
            border-radius: 8px;
            overflow: hidden;
        }

        .entry-zone-band {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 5;
            pointer-events: none;

            background: rgba(6, 182, 212, 0.10);

            border-top: 1px solid rgba(6, 182, 212, 0.35);
            border-bottom: 1px solid rgba(6, 182, 212, 0.35);
        }

        body:not(.dark-mode) .trading-chart-panel {
            background: rgba(248, 250, 252, .70);
            border-color: rgba(59, 130, 246, .20);
        }

        @media (max-width: 700px) {
            .trading-plan-chart {
                height: 340px;
            }
        }

        .trading-chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
        }

        .trading-chart-legend {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 12px;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .legend-current .legend-dot {
            background: #3b82f6;
        }

        .legend-entry .legend-dot {
            background: #06b6d4;
        }

        .legend-stop .legend-dot {
            background: #ef4444;
        }

        .legend-target .legend-dot {
            background: #22c55e;
        }

        body:not(.dark-mode) .legend-item {
            color: #475569;
        }

        @media (max-width: 700px) {

            .trading-chart-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .trading-chart-legend {
                justify-content: flex-start;
            }

        }

        .chart-indicator-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .indicator-btn {
            padding: 5px 9px;
            border: 1px solid rgba(148, 163, 184, .25);
            border-radius: 6px;
            background: rgba(15, 23, 42, .45);
            color: #94a3b8;
            font-size: 9px;
            font-weight: 800;
            cursor: pointer;
            transition: .15s ease;
        }

        .indicator-btn:hover {
            border-color: rgba(59, 130, 246, .60);
            color: #e2e8f0;
        }

        .indicator-btn.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, .18);
            color: #60a5fa;
        }

        body:not(.dark-mode) .indicator-btn {
            background: rgba(255, 255, 255, .70);
            color: #64748b;
        }

        body:not(.dark-mode) .indicator-btn.active {
            background: rgba(59, 130, 246, .10);
            color: #2563eb;
        }

    </style>

</head>

<body>

    {% from "_stock_card.html" import stock_card %}

    <div class="detail-container">

        <div class="detail-toolbar">

            <a
                href="{{ url_for('dashboard') }}"
                class="back-button"
            >
                ← Kembali ke Dashboard
            </a>

            <button
                type="button"
                class="theme-toggle"
                id="themeToggle"
                title="Ganti tema"
            >
                🌙
            </button>

        </div>

        <!-- ============================================= -->
        <!-- TRADING PLAN CHART -->
        <!-- ============================================= -->

        <div class="trading-chart-panel">

            <div class="trading-chart-header">

                <div>
                    <div class="trading-chart-title">
                        TRADING PLAN CHART
                    </div>

                    <div class="trading-chart-subtitle">
                        {{ stock.code }} · Daily · 60 Candles
                    </div>
                </div>

                <div class="trading-chart-legend">

                    <span class="legend-item legend-current">
                        <span class="legend-dot"></span>
                        Current
                    </span>

                    <span class="legend-item legend-entry">
                        <span class="legend-dot"></span>
                        Entry Zone
                    </span>

                    <span class="legend-item legend-stop">
                        <span class="legend-dot"></span>
                        Stop Loss
                    </span>

                    <span class="legend-item legend-target">
                        <span class="legend-dot"></span>
                        TP1 / TP2
                    </span>

                </div>

                <div class="chart-indicator-toggle">

                    <button
                        type="button"
                        id="toggle-ma20"
                        class="indicator-btn"
                    >
                        MA20
                    </button>

                    <button
                        type="button"
                        id="toggle-ma50"
                        class="indicator-btn"
                    >
                        MA50
                    </button>

                </div>

            </div>

            <div
                id="trading-plan-chart"
                class="trading-plan-chart"
            >
                <div
                    id="entry-zone-band"
                    class="entry-zone-band"
                ></div>
            </div>

        </div>
        
        <div class="detail-card-wrapper">

            {{ stock_card(stock, 1) }}

        </div>

    </div>

    <script>

        const themeToggle =
            document.getElementById("themeToggle");

        const savedTheme =
            localStorage.getItem("aiTraderTheme") || "light";

        document.body.classList.toggle(
            "dark-mode",
            savedTheme === "dark"
        );

        themeToggle.textContent =
            savedTheme === "dark" ? "☀️" : "🌙";

        themeToggle.addEventListener(
            "click",
            function () {

                const isDark =
                    document.body.classList.toggle(
                        "dark-mode"
                    );

                localStorage.setItem(
                    "aiTraderTheme",
                    isDark ? "dark" : "light"
                );

                themeToggle.textContent =
                    isDark ? "☀️" : "🌙";
            }
        );

    </script>

<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const container = document.getElementById(
        "trading-plan-chart"
    );

    if (!container) {
        return;
    }

    const chartData = {{ chart_data | tojson }};

    if (!chartData || chartData.length === 0) {
        return;
    }

    const isDark = document.body.classList.contains(
        "dark-mode"
    );

    const chart = LightweightCharts.createChart(
        container,
        {
            width: container.clientWidth,
            height: container.clientHeight,

            layout: {
                background: {
                    color: isDark
                        ? "#071426"
                        : "#ffffff"
                },
                textColor: isDark
                    ? "#94a3b8"
                    : "#475569"
            },

            grid: {
                vertLines: {
                    color: isDark
                        ? "rgba(148,163,184,0.06)"
                        : "rgba(15,23,42,0.06)"
                },
                horzLines: {
                    color: isDark
                        ? "rgba(148,163,184,0.06)"
                        : "rgba(15,23,42,0.06)"
                }
            },

            rightPriceScale: {
                borderColor: "rgba(148,163,184,0.20)"
            },

            timeScale: {
                borderColor: "rgba(148,163,184,0.20)",
                timeVisible: false
            }
        }
    );

    const candleSeries =
        chart.addCandlestickSeries({
            upColor: "#22c55e",
            downColor: "#ef4444",
            borderUpColor: "#22c55e",
            borderDownColor: "#ef4444",
            wickUpColor: "#22c55e",
            wickDownColor: "#ef4444",
            priceLineVisible: false,
            lastValueVisible: false
        });

    const candleData = chartData.map(
        function (item) {

            return {
                time: item.time,
                open: item.open,
                high: item.high,
                low: item.low,
                close: item.close
            };
        }
    );

    candleSeries.setData(
        candleData
    );

    const volumeSeries =
        chart.addHistogramSeries({
            priceFormat: {
                type: "volume"
            },

            priceScaleId: "volume",

            priceLineVisible: false,
            lastValueVisible: false,

            scaleMargins: {
                top: 0.80,
                bottom: 0
            }
        });
        

    const volumeData = chartData.map(
        function (item) {

            return {
                time: item.time,
                value: item.volume,

                color:
                    item.close >= item.open
                        ? "rgba(34, 197, 94, 0.55)"
                        : "rgba(239, 68, 68, 0.55)"
            };
        }
    );

    volumeSeries.setData(
        volumeData
    );

    const ma20Data = chartData
        .filter(
            function (item) {
                return item.ma20 !== null;
            }
        )
        .map(
            function (item) {
                return {
                    time: item.time,
                    value: item.ma20
                };
            }
        );

    const ma50Data = chartData
        .filter(
            function (item) {
                return item.ma50 !== null;
            }
        )
        .map(
            function (item) {
                return {
                    time: item.time,
                    value: item.ma50
                };
            }
        );

    const ma20Series =
        chart.addLineSeries({
            color: "#f59e0b",
            lineWidth: 2,
            priceLineVisible: false,
            lastValueVisible: false,
            visible: false
        });

    const ma50Series =
        chart.addLineSeries({
            color: "#a855f7",
            lineWidth: 2,
            priceLineVisible: false,
            lastValueVisible: false,
            visible: false
        });

    ma20Series.setData(
        ma20Data
    );

    ma50Series.setData(
        ma50Data
    );

    chart.priceScale("volume").applyOptions({
        scaleMargins: {
            top: 0.80,
            bottom: 0
        }
    });

    const currentPrice = {{ stock.price | float }};

    candleSeries.createPriceLine({
        price: currentPrice,
        color: "#3b82f6",
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: "CURRENT"
    });

    const entryLow = {{ stock.entry_low | float }};
    const entryHigh = {{ stock.entry_high | float }};

    const entryZoneBand = document.getElementById(
            "entry-zone-band"
        );

        function updateEntryZoneBand() {

            if (!entryZoneBand) {
                return;
            }

            const highCoordinate =
                candleSeries.priceToCoordinate(
                    entryHigh
                );

            const lowCoordinate =
                candleSeries.priceToCoordinate(
                    entryLow
                );

            if (
                highCoordinate === null ||
                lowCoordinate === null
            ) {
                return;
            }

            const top = Math.min(
                highCoordinate,
                lowCoordinate
            );

            const bottom = Math.max(
                highCoordinate,
                lowCoordinate
            );

            entryZoneBand.style.top =
                `${top}px`;

            entryZoneBand.style.height =
                `${bottom - top}px`;
        }

    candleSeries.createPriceLine({
        price: entryLow,
        color: "#06b6d4",
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: "ENTRY LOW"
    });

    candleSeries.createPriceLine({
        price: entryHigh,
        color: "#06b6d4",
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: "ENTRY HIGH"
    });

    const stopLoss = {{ stock.stop_loss | float }};
    const target1 = {{ stock.target1 | float }};
    const target2 = {{ stock.target2 | float }};

    candleSeries.createPriceLine({
        price: stopLoss,
        color: "#ef4444",
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: "STOP LOSS"
    });

    candleSeries.createPriceLine({
        price: target1,
        color: "#22c55e",
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: "TP1"
    });

    candleSeries.createPriceLine({
        price: target2,
        color: "#16a34a",
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: "TP2"
    });

    chart.timeScale().fitContent();

    setTimeout(
        updateEntryZoneBand,
        100
    );

    chart.timeScale().subscribeVisibleLogicalRangeChange(
        function () {
            requestAnimationFrame(
                updateEntryZoneBand
            );
        }
    );

    
    const resizeChart = function () {

        chart.applyOptions({
            width: container.clientWidth,
            height: container.clientHeight
        });

        setTimeout(
            updateEntryZoneBand,
            50
        );
    };

    window.addEventListener(
        "resize",
        resizeChart
    );

    const ma20Button =
        document.getElementById(
            "toggle-ma20"
        );

    const ma50Button =
        document.getElementById(
            "toggle-ma50"
        );

    let ma20Visible = false;
    let ma50Visible = false;

    if (ma20Button) {

        ma20Button.addEventListener(
            "click",
            function () {

                ma20Visible =
                    !ma20Visible;

                ma20Series.applyOptions({
                    visible: ma20Visible
                });

                ma20Button.classList.toggle(
                    "active",
                    ma20Visible
                );
            }
        );
    }

    if (ma50Button) {

        ma50Button.addEventListener(
            "click",
            function () {

                ma50Visible =
                    !ma50Visible;

                ma50Series.applyOptions({
                    visible: ma50Visible
                });

                ma50Button.classList.toggle(
                    "active",
                    ma50Visible
                );
            }
        );
    }

});
</script>

</body>

</html>
